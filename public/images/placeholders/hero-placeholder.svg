<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Temple hero background placeholder" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a0d0d"/>
      <stop offset="55%" stop-color="#7a1414"/>
      <stop offset="100%" stop-color="#5c1010"/>
    </linearGradient>
    <radialGradient id="hglow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f5deA0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5deA0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.6" fill="#e8c368" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#hbg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#hglow)"/>
  <text x="800" y="470" font-size="260" text-anchor="middle" opacity="0.16">🛕</text>
</svg>